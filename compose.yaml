name: dota-analytics

services:
  web:
    build: .
    ports:
      - "127.0.0.1:${DOTA_ANALYTICS_WEB_PORT:-8000}:8000"
    environment:
      DOTA_ANALYTICS_DB_BACKEND: postgresql
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-dota_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-dota_analytics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/matches', timeout=3).read()
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dota_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-dota_analytics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  postgres-data:
